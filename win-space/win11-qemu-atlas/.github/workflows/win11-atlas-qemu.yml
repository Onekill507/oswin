---
# ==============================================================================
#  Windows 11 25H2 (x64) -> QEMU/KVM -> AtlasOS staging lab
#  6-hour disposable VM on a GitHub-hosted runner, reachable over a TOKENLESS
#  Cloudflare Quick Tunnel (https://*.trycloudflare.com) serving noVNC.
#
#  You supply the ISO URL at launch time (workflow_dispatch input) - nothing is
#  hardcoded, nothing is mirrored, no Microsoft account / product key / API
#  token is required.
#
#  Pipeline:
#    preflight  -> validate the ISO URL (HEAD, type, size, range support)
#    vm         -> fetch ISO, verify it really is Win11 x64 26200 (25H2),
#                  build autounattend media, boot UEFI+SecureBoot+TPM2.0 VM,
#                  prove the guest booted (beacon milestones, not "it printed
#                  something"), stage AtlasOS, keep the tunnel alive, snapshot,
#                  graceful shutdown, upload evidence.
# ==============================================================================

name: Win11 25H2 + AtlasOS (QEMU, 6h, tokenless)

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: >-
          Direct download URL of the Windows 11 25H2 x64 ISO (required).
          Must be a direct link (no HTML landing page). UUP dump / MS servers /
          your own S3-R2 presigned link all work.
        required: true
        type: string
      iso_sha256:
        description: "Optional SHA-256 of the ISO. Empty = skip hash check."
        required: false
        default: ""
        type: string
      windows_edition:
        description: "Edition inside the ISO to install."
        required: false
        default: "Windows 11 Pro"
        type: choice
        options:
          - "Windows 11 Pro"
          - "Windows 11 Home"
          - "Windows 11 Education"
          - "Windows 11 Enterprise"
          - "Windows 11 Pro for Workstations"
      atlas_mode:
        description: >-
          stage  = download AME Wizard + Atlas Playbook, run all preflight
                   checks, leave the wizard open for you in noVNC (recommended)
          verify = do everything except launching the wizard
          none   = plain Windows 11, no Atlas assets
        required: false
        default: "stage"
        type: choice
        options: ["stage", "verify", "none"]
      session_minutes:
        description: "Minutes to keep the VM alive (max 340; job cap is 6h)."
        required: false
        default: "330"
        type: string
      ram_mb:
        description: "Guest RAM in MiB."
        required: false
        default: "8192"
        type: string
      vcpus:
        description: "Guest vCPU count."
        required: false
        default: "4"
        type: string
      disk_gb:
        description: "Virtual disk size in GiB (qcow2, thin)."
        required: false
        default: "64"
        type: string
      vnc_password:
        description: >-
          Password for the noVNC session. Leave empty for a random one
          (printed in the job summary). The tunnel URL itself is tokenless.
        required: false
        default: ""
        type: string
      export_disk:
        description: "Upload the compressed qcow2 as an artifact at the end."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: win11-atlas-${{ github.ref }}
  cancel-in-progress: false

env:
  VM_DIR: /mnt/vm
  BEACON_PORT: "8099"
  VNC_DISPLAY: "1"          # -> TCP 5901
  NOVNC_PORT: "6080"
  DEBIAN_FRONTEND: noninteractive

jobs:
  # ---------------------------------------------------------------------------
  # 1. Cheap, fast gate: never burn a 6-hour runner on a bad URL.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight - validate ISO URL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      iso_bytes: ${{ steps.probe.outputs.iso_bytes }}
      iso_name: ${{ steps.probe.outputs.iso_name }}
      resumable: ${{ steps.probe.outputs.resumable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate numeric inputs
        run: |
          set -euo pipefail
          check () { # name value min max
            case "$2" in ''|*[!0-9]*) echo "::error::$1 must be an integer (got '$2')"; exit 1;; esac
            if [ "$2" -lt "$3" ] || [ "$2" -gt "$4" ]; then
              echo "::error::$1 must be between $3 and $4 (got $2)"; exit 1
            fi
          }
          check session_minutes "${{ inputs.session_minutes }}" 10 340
          check ram_mb          "${{ inputs.ram_mb }}"          4096 14336
          check vcpus           "${{ inputs.vcpus }}"           2 4
          check disk_gb         "${{ inputs.disk_gb }}"         40 120
          echo "Inputs OK."

      - name: Probe the ISO URL
        id: probe
        run: bash scripts/preflight-iso.sh
        env:
          ISO_URL: ${{ inputs.iso_url }}

      - name: Summary
        run: |
          {
            echo "### Preflight passed"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| File | \`${{ steps.probe.outputs.iso_name }}\` |"
            echo "| Size | ${{ steps.probe.outputs.iso_gib }} GiB |"
            echo "| Resumable (HTTP Range) | ${{ steps.probe.outputs.resumable }} |"
            echo "| Edition to install | ${{ inputs.windows_edition }} |"
            echo "| Atlas mode | ${{ inputs.atlas_mode }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. The 6-hour VM.
  # ---------------------------------------------------------------------------
  vm:
    name: Boot Windows 11 + stage AtlasOS
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360          # hard GitHub cap for a single job
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim disk space
        run: bash scripts/free-space.sh

      - name: Enable /dev/kvm for the runner user
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          grep -Eo 'vmx|svm' /proc/cpuinfo | sort -u | head -2

      - name: Install QEMU, OVMF, swtpm, noVNC, tooling
        run: bash scripts/install-host-deps.sh

      - name: Prepare VM workspace
        run: |
          set -euo pipefail
          sudo mkdir -p "$VM_DIR"
          sudo chown "$USER:$USER" "$VM_DIR"
          mkdir -p "$VM_DIR"/{iso,disk,media,logs,shots,atlas}
          df -h "$VM_DIR" /

      - name: Download Windows 11 ISO
        run: bash scripts/fetch-iso.sh
        env:
          ISO_URL: ${{ inputs.iso_url }}
          ISO_SHA256: ${{ inputs.iso_sha256 }}
          RESUMABLE: ${{ needs.preflight.outputs.resumable }}

      - name: Verify ISO is Windows 11 25H2 x64
        id: isocheck
        run: bash scripts/verify-iso.sh
        env:
          WINDOWS_EDITION: ${{ inputs.windows_edition }}

      - name: Download virtio-win drivers
        run: bash scripts/fetch-virtio.sh

      - name: Build autounattend / provisioning media
        run: bash scripts/make-unattend-iso.sh
        env:
          WINDOWS_EDITION: ${{ inputs.windows_edition }}
          ATLAS_MODE: ${{ inputs.atlas_mode }}
          BEACON_PORT: ${{ env.BEACON_PORT }}
          ADMIN_USER: atlas
          ADMIN_PASS: Atlas!2026

      - name: Pre-fetch AtlasOS assets on the host (fast, cached into media)
        if: inputs.atlas_mode != 'none'
        run: bash scripts/fetch-atlas.sh

      - name: Create disk, TPM 2.0 and UEFI SecureBoot vars
        run: bash scripts/prepare-firmware.sh
        env:
          DISK_GB: ${{ inputs.disk_gb }}

      - name: Start beacon server (guest -> host boot telemetry)
        run: |
          set -euo pipefail
          nohup python3 scripts/beacon-server.py \
            --port "$BEACON_PORT" \
            --state "$VM_DIR/logs/beacons.jsonl" \
            > "$VM_DIR/logs/beacon-server.log" 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:$BEACON_PORT/health" && break || sleep 0.5
          done
          echo

      - name: Boot the VM
        run: bash scripts/boot-vm.sh
        env:
          RAM_MB: ${{ inputs.ram_mb }}
          VCPUS: ${{ inputs.vcpus }}
          VNC_PASSWORD: ${{ inputs.vnc_password }}

      - name: Publish tokenless noVNC tunnel
        id: tunnel
        run: bash scripts/expose-novnc.sh
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}

      - name: Wait for Windows Setup -> OOBE -> desktop (boot verification)
        id: bootcheck
        run: |
          set -euo pipefail
          python3 scripts/wait-milestones.py \
            --state "$VM_DIR/logs/beacons.jsonl" \
            --qmp "$VM_DIR/qmp.sock" \
            --shots "$VM_DIR/shots" \
            --require winpe:900 \
            --require specialize:3600 \
            --require firstlogon:2400 \
            --require desktop:900

      - name: Guest readiness report (AtlasOS checklist)
        id: checklist
        run: |
          set -euo pipefail
          python3 scripts/wait-milestones.py \
            --state "$VM_DIR/logs/beacons.jsonl" \
            --qmp "$VM_DIR/qmp.sock" \
            --shots "$VM_DIR/shots" \
            --require checklist:1800
          python3 scripts/render-checklist.py \
            --state "$VM_DIR/logs/beacons.jsonl" \
            --out "$GITHUB_STEP_SUMMARY"

      - name: Backup - live snapshot before any Atlas change
        run: |
          set -euo pipefail
          python3 scripts/qmp.py "$VM_DIR/qmp.sock" snapshot pre-atlas
          echo "Snapshot 'pre-atlas' written into the qcow2."

      - name: Session banner
        run: bash scripts/session-banner.sh
        env:
          TUNNEL_URL: ${{ steps.tunnel.outputs.url }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          ATLAS_MODE: ${{ inputs.atlas_mode }}

      - name: Hold the session open
        run: |
          set -euo pipefail
          python3 scripts/hold-session.py \
            --minutes "${{ inputs.session_minutes }}" \
            --qmp "$VM_DIR/qmp.sock" \
            --shots "$VM_DIR/shots" \
            --state "$VM_DIR/logs/beacons.jsonl" \
            --tunnel "${{ steps.tunnel.outputs.url }}" \
            --shot-interval 300

      - name: Graceful shutdown
        if: always()
        run: bash scripts/shutdown-vm.sh

      - name: Compress disk image
        if: always() && inputs.export_disk
        run: bash scripts/export-disk.sh

      - name: Upload logs + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win11-atlas-evidence
          if-no-files-found: warn
          retention-days: 5
          path: |
            /mnt/vm/logs/**
            /mnt/vm/shots/**
            /mnt/vm/media/autounattend.xml

      - name: Upload disk image
        if: always() && inputs.export_disk
        uses: actions/upload-artifact@v4
        with:
          name: win11-atlas-disk
          if-no-files-found: warn
          retention-days: 2
          compression-level: 0
          path: /mnt/vm/export/*
